# Configuracion del servidor y entorno
spring.docker.compose.enabled=false
server.port=8080

# Configuracion de base de datos (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tallerdb}
spring.datasource.username=${DB_USER:talleruser}
spring.datasource.password=${DB_PASSWORD:tallerpass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Estrategia de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.flyway.enabled=false

# URLs de Keycloak (SIN /auth para Keycloak 23.0+)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/taller
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/taller/protocol/openid-connect/certs

# Configuracion de Keycloak
keycloak.auth-server-url=http://keycloak:8080
keycloak.realm=taller
keycloak.resource=taller-api
keycloak.credentials.secret=jx34gvJ7Vo9UwxLwsbLa1K3C58ZbjrLh

# Keycloak Admin API
keycloak.admin.client-id=taller-api-admin
keycloak.admin.client-secret=g1IP83yywb0qGcpP2RJ93wKXTcK4CuXH
keycloak.admin.url=http://keycloak:8080
keycloak.admin.realm=taller
app.keycloak.enabled=true

# Configuracion de RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Exchange principal para los eventos de la app
app.rabbitmq.exchange=app.events

# Evento: creacion de usuario
app.rabbitmq.usuarios.queue=usuarios.events
app.rabbitmq.usuarios.routingKey=usuarios.created

# Evento: eliminacion de usuario
app.rabbitmq.usuarios.eliminados.queue=usuarios.eliminados.events
app.rabbitmq.usuarios.eliminados.routingKey=usuarios.deleted

# Evento: inicio de sesion
app.rabbitmq.sesiones.queue=sesiones.events
app.rabbitmq.sesiones.routingKey=sesiones.iniciada

# Evento: password
app.rabbitmq.password.queue=password.events
app.rabbitmq.password.routingKey=password.reset

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator
management.health.defaults.enabled=true

# Metadata de version
app.version=${project.version:0.0.1-SNAPSHOT}