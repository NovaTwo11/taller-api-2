global:
  scrape_interval: 15s          # Cada cuánto tiempo se recopilan métricas
  evaluation_interval: 15s      # Cada cuánto se evalúan las reglas
  scrape_timeout: 10s           # Tiempo máximo por petición de scrape

# ===============================
# Configuración de Prometheus
# ===============================
scrape_configs:

  # 1️⃣ Prometheus monitoreándose a sí mismo
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # 2️⃣ Monitoreo de la aplicación principal (Spring Boot / taller-api)
  - job_name: 'taller-api'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['taller-api-2:8080']
    relabel_configs:
      # 1. Etiquetas de servicio: Es útil para agrupar métricas de todos los pods/instancias
      - target_label: service
        replacement: "taller-api"

      # 2. Etiqueta de instancia: La dejamos con el valor por defecto (__address__),
      #    o forzamos un valor más descriptivo si lo prefieres, pero 'service' ya basta.
      #    Si quieres que la instancia se llame 'tallerapi2_api', puedes omitir el 'replacement: "taller-api"'
      - source_labels: [__address__]
        target_label: instance
        replacement: "$1" # Usar el valor capturado del 'target' (tallerapi2_api:8080)

  # 3️⃣ Loki (almacenamiento de logs)
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
    metrics_path: /metrics
    relabel_configs:
      - target_label: service
        replacement: "loki"

  # 4️⃣ Promtail (agente de logs)
  - job_name: 'promtail'
    static_configs:
      - targets: ['promtail:9080']
    metrics_path: /metrics
    relabel_configs:
      - target_label: service
        replacement: "promtail"

  # 5️⃣ Grafana
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: /metrics
    relabel_configs:
      - target_label: service
        replacement: "grafana"
