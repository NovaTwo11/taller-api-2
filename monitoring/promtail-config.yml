server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  # Loki recibe los logs en el puerto 3100 dentro de la red docker-compose
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # =========================
  # 1️⃣ Logs de contenedores Docker
  # =========================
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    # Reetiquetar para identificar origen de cada contenedor
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'

    pipeline_stages:
      # Formatea las líneas JSON del logback encoder
      - json:
          expressions:
            timestamp: timestamp
            message: message
            level: level
            logger: logger_name
            thread: thread_name
            appName: appName
      # Convierte timestamp al formato correcto
      - timestamp:
          source: timestamp
          format: RFC3339
      # Añade nivel de log como label
      - labels:
          level:
          appName:
          service:

  # =========================
  # 2️⃣ (Opcional) Logs del host o archivos locales
  # =========================
  # Si en tu contenedor "taller-api" montas una carpeta de logs locales (./logs:/app/logs),
  # puedes descomentar esta sección para que Promtail lea también esos archivos directamente.

  # - job_name: app-logs
  #   static_configs:
  #     - targets:
  #         - localhost
  #       labels:
  #         job: taller-api
  #         app: taller-api
  #         __path__: /app/logs/*.log
