version: "3.9"

services:
  postgres:
    image: postgres:15.3
    container_name: tallerapi2_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-tallerdb}
      POSTGRES_USER: ${DB_USER:-talleruser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tallerpass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ci_net

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.2
    container_name: tallerapi2_keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ci_net

  adminer:
    image: adminer:4
    container_name: tallerapi2_adminer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8081:8080"
    networks:
      - ci_net

  maildev:
    image: maildev/maildev:2.1.0
    container_name: tallerapi2_maildev
    ports:
      - "1080:1080"   # interfaz web
      - "1025:1025"   # smtp
    restart: unless-stopped
    networks:
      - ci_net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: tallerapi2_rabbitmq
    ports:
      - "5672:5672"   # amqp
      - "15672:15672" # UI de administración
    restart: unless-stopped
    networks:
      - ci_net

  notification-orchestrator:
    build: ../notification-orchestrator
    ports:
      - "8086:8080"
    depends_on:
      - rabbitmq
    networks:
      - ci_net

  notification-delivery:
    build: ../notification-delivery
    ports:
      - "8087:8080"
    depends_on:
      - rabbitmq
      - maildev
    networks:
      - ci_net

  # =========================
  # CI/CD - Jenkins
  # =========================
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: tallerapi2_jenkins
    user: root
    ports:
      - "8085:8080"
      - "50000:50000"
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # Montar el workspace para que Allure pueda acceder a los reportes
      - ./jenkins-workspace:/var/jenkins_home/workspace
    networks:
      - ci_net
    restart: unless-stopped

  # =========================
  # Calidad - SonarQube LTS
  # =========================
  sonarqube:
    image: sonarqube:9.9-community
    container_name: tallerapi2_sonarqube
    depends_on:
      sonardb:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonardb:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      - ci_net
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  sonardb:
    image: postgres:13
    container_name: tallerapi2_sonardb
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ci_net
    restart: unless-stopped

volumes:
  pgdata:
  jenkins_home:
  sonar_db:
  sonar_data:
  sonar_extensions:
  sonar_logs:

networks:
  ci_net: