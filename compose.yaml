services:
  postgres:
    image: postgres:15.3
    container_name: tallerapi2_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-tallerdb}
      POSTGRES_USER: ${DB_USER:-talleruser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tallerpass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ci_net

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.2
    container_name: tallerapi2_keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ci_net

  adminer:
    image: adminer:4
    container_name: tallerapi2_adminer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8081:8080"
    networks:
      - ci_net

  maildev:
    image: maildev/maildev:2.1.0
    container_name: tallerapi2_maildev
    ports:
      - "1080:1080"   # interfaz web
      - "1025:1025"   # smtp
    restart: unless-stopped
    networks:
      - ci_net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: tallerapi2_rabbitmq
    ports:
      - "5672:5672"   # amqp
      - "15672:15672" # UI de administración
    restart: unless-stopped
    networks:
      - ci_net

  taller-api-2:
    build: ../taller-api-2
    container_name: tallerapi2_api
    ports:
      - "8080:8080"
    environment:
      # Las variables de entorno para que se conecte a otros servicios
      - DB_URL=jdbc:postgresql://tallerapi2_postgres:5432/tallerdb
      - DB_USER=${DB_USER:-talleruser}
      - DB_PASSWORD=${DB_PASSWORD:-tallerpass}
      # URLs internas de docker
      - KEYCLOAK_SERVER_URL=http://tallerapi2_keycloak:8080
      - RABBIT_HOST=tallerapi2_rabbitmq
      - RABBIT_PORT=5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - ci_net


  notification-orchestrator:
    build: ../notification-orchestrator
    ports:
      - "8086:8080"
    depends_on:
      - rabbitmq
    networks:
      - ci_net

  notification-delivery:
    build: ../notification-delivery
    ports:
      - "8087:8080"
    depends_on:
      - rabbitmq
      - maildev
    networks:
      - ci_net

  sonarqube:
    image: sonarqube:9.9-community
    container_name: tallerapi2_sonarqube
    depends_on:
      sonardb:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonardb:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      ci_net:
        aliases:
          - sonarqube   # alias sin "_"
          - sonar       # alias alterno, opcional
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: tallerapi2_jenkins
    user: root
    ports:
      - "8085:8080"
      - "50000:50000"
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./jenkins-workspace:/var/jenkins_home/workspace
    networks:
      - ci_net
    restart: unless-stopped

  sonardb:
    image: postgres:13
    container_name: tallerapi2_sonardb
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ci_net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - ci_net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
      - loki
    networks:
        - ci_net


  loki:
    image: grafana/loki:2.9.1
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml
    networks:
        - ci_net

  promtail:
    image: grafana/promtail:2.9.3
    container_name: promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
      - promtail-positions:/tmp
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped
    networks:
        - ci_net



volumes:
  pgdata:
  jenkins_home:
  sonar_db:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  grafana-data:
  prometheus-data:
  loki-data:
  promtail-positions:


networks:
  ci_net: